services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: paylite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: paylite
    ports:
      - "5432:5432"
    volumes:
      - paylite_pgdata:/var/lib/postgresql/data

volumes:
  paylite_pgdata: